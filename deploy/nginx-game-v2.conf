# Place this block inside the server { ... } serving 94.136.185.237.
# It must appear before any generic /react_project/ or PHP location.

location = /react_project/game/v2 {
    return 301 /react_project/game/v2/;
}

location ^~ /react_project/game/v2/ {
    # Change this document root if the built files are deployed elsewhere.
    root /var/www/html;

    # Serve real assets first; send client-side routes to React Router.
    try_files $uri $uri/ /react_project/game/v2/index.html;
}
